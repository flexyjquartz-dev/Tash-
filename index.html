<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tash</title>
  <style>
    :root {
      color-scheme: light;
      font-family: Arial, sans-serif;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #f4f7fb;
      color: #172033;
    }

    main {
      max-width: 640px;
      margin: 24px;
      padding: 48px 32px;
      text-align: center;
      background: white;
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(23, 32, 51, 0.12);
    }

    h1 {
      margin-top: 0;
      font-size: 2.5rem;
    }

    p {
      font-size: 1.1rem;
      line-height: 1.6;
    }
  </style>
</head>
<body>
  <main>
    <h1>Welcome to Tash</h1>
    <p>Your GitHub Pages website is working.</p>
  </main>
</body>
</html>
